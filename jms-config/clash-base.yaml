# Domestic domains, mainland China addresses without a domain and LAN are DIRECT. Claude and general overseas AI use dedicated US-only fallbacks.
mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: true
tcp-concurrent: true
keep-alive-interval: 30
keep-alive-idle: 30
unified-delay: true
find-process-mode: always
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  # Dial the sniffed domain, so apps that resolved through a poisoned DNS outside the core still reach the real host.
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
  - +.push.apple.com
  - Mijia Cloud
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
  - fdfe:dcba:9876::1/126
  dns-hijack:
  - any:53
  - tcp://any:53
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - captive.apple.com
  - connectivitycheck.gstatic.com
  - +.ntp.org
  - time.*.apple.com
  - time.*.com
  - +.stun.*
  - +.push.apple.com
  - +.openai.com
  - +.chatgpt.com
  - +.oaistatic.com
  - +.oaiusercontent.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#默认代理
  - https://8.8.8.8/dns-query#默认代理
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  respect-rules: false
  nameserver-policy:
    +.claude.ai:
    - https://1.1.1.1/dns-query#Claude 美国
    - https://8.8.8.8/dns-query#Claude 美国
    +.anthropic.com:
    - https://1.1.1.1/dns-query#Claude 美国
    - https://8.8.8.8/dns-query#Claude 美国
    +.openai.com:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    +.chatgpt.com:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    +.gemini.google.com:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    +.muse.ai:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    +.metaaivm.com:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    rule-set:jms-cn-ai-extra,jms-ai-cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    rule-set:jms-claude-deps:
    - https://1.1.1.1/dns-query#Claude 美国
    - https://8.8.8.8/dns-query#Claude 美国
    rule-set:jms-claude-bootstrap,jms-anthropic:
    - https://1.1.1.1/dns-query#Claude 美国
    - https://8.8.8.8/dns-query#Claude 美国
    rule-set:jms-openai-bootstrap,jms-openai:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    rule-set:jms-gemini-bootstrap,jms-gemini,jms-google-shared:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    rule-set:jms-ai,jms-ai-shared,jms-twitter-shared,jms-bing-shared,jms-meta-bootstrap:
    - https://1.1.1.1/dns-query#AI 美国
    - https://8.8.8.8/dns-query#AI 美国
    rule-set:jms-private:
    - system://
    rule-set:jms-proxy:
    - https://1.1.1.1/dns-query#默认代理
    - https://8.8.8.8/dns-query#默认代理
    rule-set:jms-direct:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  use-hosts: true
  use-system-hosts: true
# Display names by JMS server id; exits verified 2026-11-14 via ipinfo.io, ipwho.is and ip-api.com.
# Unknown ids are shown as "JMS · <id>" so a new server never exposes the account prefix.
jms-node-names:
  s3: 美国洛杉矶01
  s2: 美国洛杉矶02
  s801: 美国洛杉矶03
  s4: 日本大阪01
  s5: 荷兰阿姆斯特丹01
jms-us-nodes:
- s3
- s2
- s801
jms-udp-nodes:
- s2
- s3
- s4
- s5
- s801
proxy-groups:
- name: 默认代理
  type: select
  icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Proxy.png
  include-all-proxies: true
- name: 自动选择
  type: url-test
  icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Auto.png
  include-all-proxies: true
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 50
  timeout: 5000
  max-failed-times: 2
- name: Claude 美国
  type: fallback
  icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Claude.png
  jms-us-only: true
  proxies:
  - REJECT
  url: https://api.anthropic.com/v1/models
  expected-status: 401/405
  interval: 300
  timeout: 5000
  max-failed-times: 2
  lazy: false
- name: AI 美国
  type: fallback
  icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Fallback.png
  jms-us-only: true
  proxies:
  - REJECT
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  timeout: 5000
  max-failed-times: 2
  lazy: false
