# JMS remote routing: domestic AI is DIRECT; overseas AI shares one US-only fallback.
mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: always
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#JMS
  - https://8.8.8.8/dns-query#JMS
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  respect-rules: false
  nameserver-policy:
    rule-set:jms-cn-ai-extra,jms-ai-cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    rule-set:jms-claude-bootstrap,jms-anthropic:
    - https://1.1.1.1/dns-query#AI-US
    - https://8.8.8.8/dns-query#AI-US
    rule-set:jms-openai-bootstrap,jms-openai:
    - https://1.1.1.1/dns-query#AI-US
    - https://8.8.8.8/dns-query#AI-US
    rule-set:jms-gemini-bootstrap,jms-gemini,jms-google-shared:
    - https://1.1.1.1/dns-query#AI-US
    - https://8.8.8.8/dns-query#AI-US
    rule-set:jms-ai,jms-ai-resources,jms-artifact-resources,jms-ai-shared:
    - https://1.1.1.1/dns-query#AI-US
    - https://8.8.8.8/dns-query#AI-US
    rule-set:jms-private:
    - system://
