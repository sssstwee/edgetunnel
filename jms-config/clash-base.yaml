  use-hosts: true
  use-system-hosts: true
jms-us-nodes:
- s3
- s2
- s801
jms-udp-nodes:
- s1
- s2
- s3
- s4
- s5
- s801
proxy-groups:
- name: JMS
  type: select
  include-all-proxies: true
- name: JMS Auto
  type: url-test
  include-all-proxies: true
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  tolerance: 50
- name: AI-US
  type: fallback
  jms-us-only: true
  proxies:
  - REJECT
  url: https://www.gstatic.com/generate_204
  expected-status: 204
  interval: 300
  lazy: false
rule-providers:
  jms-anthropic:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.yaml
    path: ./ruleset/jms/anthropic.yaml
    interval: 86400
    proxy: JMS
  jms-openai:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.yaml
