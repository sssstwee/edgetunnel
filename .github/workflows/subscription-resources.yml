name: Subscription resources

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subscription-resources
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'sssstwee/edgetunnel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --omit=dev --ignore-scripts
      # Pinned Mihomo compiles the .mrs rule sets; the archive is checked against its release digest.
      - name: Install Mihomo rule compiler
        env:
          MIHOMO_VERSION: v1.19.34
          MIHOMO_SHA256: 223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc
        run: |
          set -euo pipefail
          archive="mihomo-linux-amd64-$MIHOMO_VERSION.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/MetaCubeX/mihomo/releases/download/$MIHOMO_VERSION/$archive"
          echo "$MIHOMO_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "MIHOMO=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
      - name: Download and validate upstream snapshots
        run: node resources/sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit public resource snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh subscription resources'
            git push origin HEAD:main
          fi
      # Rule snapshots are committed first so a Geo release failure cannot freeze routing lists.
      - name: Verify and publish complete Geo data release
        run: node resources/sync.mjs --publish-geodata
        env:
          GH_TOKEN: ${{ github.token }}
